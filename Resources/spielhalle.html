<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spielhalle</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #008080; font: 13px Tahoma, "MS Sans Serif", Arial, sans-serif; color: #000; overflow: hidden; display: flex; flex-direction: column; user-select: none; }
  [hidden] { display: none !important; }
  .desk { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
  .window { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf; padding: 3px; display: flex; flex-direction: column; }
  .title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; padding: 3px 4px 3px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .title-bar button { min-width: 0; width: 18px; height: 16px; padding: 0; font: bold 11px Tahoma; line-height: 12px; }
  .body { padding: 10px; }
  button { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px #808080, inset 1px 1px #dfdfdf; padding: 4px 12px; font: 13px Tahoma, sans-serif; cursor: pointer; min-width: 70px; }
  button:active { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px #808080; }
  input { font: 13px Tahoma, sans-serif; padding: 3px 4px; border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; user-select: text; }
  .sunken { border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; }
  .muted { color: #666; }
  label { display: block; margin: 8px 0 3px; }
  fieldset { border: 2px groove #fff; margin: 0 0 8px; padding: 8px; }
  legend { padding: 0 4px; }

  #login { width: 340px; }
  #login .logo { font-size: 40px; text-align: center; }
  #login .row2 { display: flex; gap: 6px; }
  #login .row2 input { flex: 1; letter-spacing: 6px; font-size: 18px; text-align: center; }

  #lobby { width: min(980px, 100%); height: min(640px, 100%); }
  .lobby-body { flex: 1; display: grid; grid-template-columns: 1fr 260px; gap: 8px; padding: 8px; min-height: 0; }
  #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; align-content: start; }
  .game-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px; text-align: center; height: 130px; }
  .game-tile .ico { font-size: 36px; }
  .game-tile small { color: #333; font-size: 11px; }
  .sidebar { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #players { padding: 6px; height: 120px; overflow: auto; }
  #players div { padding: 2px 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #chatLog { flex: 1; overflow: auto; padding: 6px; user-select: text; word-wrap: break-word; }
  #chatLog .sys { color: #000080; font-style: italic; margin: 2px 0; }
  #chatForm { display: flex; gap: 4px; margin-top: 4px; }
  #chatForm input { flex: 1; min-width: 0; }

  #game { width: min(1100px, 100%); height: 100%; }
  #gameArea { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 6px; position: relative; overflow: hidden; }
  .race-root { padding: 0 !important; background: #000; }
  .race-root canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; inset: 0; pointer-events: none; color: #fff; font: bold 16px Tahoma, sans-serif; text-shadow: 1px 1px 2px #000; }
  .hud .stats { position: absolute; left: 10px; top: 10px; background: rgba(0,0,128,.6); padding: 8px 12px; border: 2px solid #fff; line-height: 1.5; }
  .hud .big { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 110px; text-align: center; }
  .hud .big.small { font-size: 34px; line-height: 1.4; }
  .hud .big.small span { font-size: 18px; }
  .hud .big.go { color: #4f4; }
  .hud .results { position: absolute; right: 10px; top: 10px; background: #c0c0c0; color: #000; text-shadow: none; font-weight: normal; padding: 8px 12px; border: 2px solid; border-color: #fff #000 #000 #fff; min-width: 200px; }
  .hud .results .hint { margin-top: 6px; color: #000080; }

  .canvas-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .canvas-wrap canvas { max-width: 100%; max-height: 100%; border: 2px solid; border-color: #808080 #fff #fff #808080; image-rendering: pixelated; }
  .row { flex: 1; min-height: 0; width: 100%; display: flex; gap: 8px; }
  .row .canvas-wrap { flex: 1; }
  .side { width: 200px; padding: 8px; overflow: auto; }
  .status-line { padding: 4px 6px; }

  .quiz { width: 100%; max-width: 720px; overflow: auto; }
  .quiz-start { text-align: center; }
  .big-btn { font-size: 16px; padding: 10px 24px; margin-top: 10px; }
  .quiz-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .timer { font: bold 28px "Courier New", monospace; color: #800000; }
  .quiz-q { background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 16px; font-size: 20px; margin: 6px 0 10px; }
  .quiz-a { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .quiz-a button { font-size: 16px; padding: 14px; text-align: left; }
  .quiz-a .picked { background: #000080; color: #fff; }
  .quiz-a .right { background: #2a2; color: #fff; }
  .quiz-a .wrong { background: #b22; color: #fff; }
  .quiz-a .dim { color: #777; }
  table.score { margin: 10px auto; border-collapse: collapse; background: #fff; min-width: 280px; }
  table.score td { padding: 4px 10px; border-bottom: 1px solid #ccc; }
  table.score td:last-child { text-align: right; font-weight: bold; }

  .taskbar { height: 32px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; gap: 6px; padding: 2px 4px; }
  .taskbar .start { font-weight: bold; min-width: 0; padding: 2px 8px; }
  .taskbar .spacer { flex: 1; }
  .taskbar .tray { border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px 8px; display: flex; gap: 10px; }
  .toast { position: fixed; right: 10px; bottom: 44px; width: 260px; z-index: 10; }
  /* ---------- Handy / Touch ---------- */
  html, body { -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .touchpad { pointer-events: none; }
  .tbtn { pointer-events: auto; position: absolute; background: rgba(192,192,192,.85); border: 2px solid; border-color: #fff #000 #000 #fff; font: bold 22px Tahoma, sans-serif; color: #000; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .tbtn.on { border-color: #000 #fff #fff #000; background: rgba(150,150,150,.95); }
  .race-pad { position: absolute; inset: 0; z-index: 5; }
  .race-pad .l1 { left: 12px; bottom: 14px; width: 80px; height: 80px; }
  .race-pad .l2 { left: 102px; bottom: 14px; width: 80px; height: 80px; }
  .race-pad .r1 { right: 12px; bottom: 102px; width: 100px; height: 80px; background: rgba(90,200,90,.85); }
  .race-pad .r2 { right: 12px; bottom: 14px; width: 100px; height: 76px; font-size: 15px; background: rgba(220,90,90,.85); }
  .race-pad .top { left: 50%; transform: translateX(-50%); top: 10px; width: 100px; height: 42px; font-size: 15px; }
  .dpad { position: relative; width: 184px; height: 124px; flex-shrink: 0; }
  .dpad .up { left: 64px; top: 0; width: 56px; height: 56px; }
  .dpad .left { left: 0; top: 64px; width: 56px; height: 56px; }
  .dpad .down { left: 64px; top: 64px; width: 56px; height: 56px; }
  .dpad .right { left: 128px; top: 64px; width: 56px; height: 56px; }
  @media (max-width: 760px), (max-height: 520px) {
    .desk { padding: 0; }
    .taskbar { display: none; }
    #lobby, #game { width: 100%; height: 100%; }
    #login { width: 100%; max-width: 360px; }
    .lobby-body { display: flex; flex-direction: column; overflow: auto; }
    #games { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .game-tile { height: auto; padding: 10px 6px; }
    .game-tile .ico { font-size: 30px; }
    .chat { min-height: 260px; flex: none; }
    #chatLog { min-height: 180px; }
    .side { display: none; }
    .quiz-a { grid-template-columns: 1fr; }
    .quiz-q { font-size: 17px; padding: 12px; }
    .hud .big { font-size: 70px; }
    .hud .big.small { font-size: 22px; }
    .hud .big.small span { font-size: 14px; }
    .hud .stats { font-size: 13px; padding: 5px 8px; }
    .hud .results { top: 60px; min-width: 160px; font-size: 13px; }
    .toast { bottom: 10px; }
    #game > .status-line .muted { display: none; }
  }
</style>
</head>
<body>
<div class="desk">

  <form class="window" id="login">
    <div class="title-bar"><span>Spielhalle – Anmelden</span></div>
    <div class="body">
      <div class="logo">🕹️</div>
      <label for="name">Dein Name:</label>
      <input id="name" maxlength="16" autocomplete="off" style="width:100%">
      <label for="room">Raumnummer (4 Ziffern):</label>
      <div class="row2"><input id="room" inputmode="numeric" maxlength="4" autocomplete="off"><button type="button" id="rnd">Zufall</button></div>
      <p class="muted">Alle mit derselben Raumnummer spielen zusammen.</p>
      <div style="text-align:right"><button type="submit">Beitreten</button></div>
    </div>
  </form>

  <div class="window" id="lobby" hidden>
    <div class="title-bar"><span>🕹️ Spielhalle – Raum <span id="roomNo"></span></span><span class="net-status"></span></div>
    <div class="lobby-body">
      <fieldset style="overflow:auto"><legend>Spiele</legend><div id="games"></div></fieldset>
      <div class="sidebar">
        <fieldset style="margin:0"><legend>Im Raum (<span id="count">1</span>)</legend><div id="players" class="sunken"></div></fieldset>
        <fieldset class="chat" style="margin:0"><legend>Chat</legend>
          <div id="chatLog" class="sunken"></div>
          <form id="chatForm"><input id="chatIn" maxlength="200" placeholder="Nachricht…" autocomplete="off"><button>Senden</button></form>
        </fieldset>
      </div>
    </div>
  </div>

  <div class="window" id="game" hidden>
    <div class="title-bar"><span id="gameTitle"></span><span><span class="net-status" style="font-weight:normal;margin-right:8px"></span><button id="closeGame" title="Zurück zur Lobby">✕</button></span></div>
    <div id="gameArea"></div>
    <div class="status-line" style="display:flex;justify-content:space-between"><span class="muted">ESC = zurück zur Lobby</span><button id="backBtn">Zur Lobby</button></div>
  </div>

</div>
<div class="taskbar">
  <button class="start">🕹️ Start</button>
  <span class="spacer"></span>
  <span class="tray"><span id="clock"></span></span>
</div>
